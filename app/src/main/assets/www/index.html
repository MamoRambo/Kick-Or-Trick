/* Kick Or Trick — Feywild midnight grimoire */
*{box-sizing:border-box}
html{background:var(--bga)}
body{margin:0;min-height:100vh;color:var(--text);font-family:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;padding:18px 12px 70px;
 background:
  radial-gradient(1.5px 1.5px at 12% 18%,color-mix(in srgb,var(--star) 60%,transparent) 50%,transparent 51%),radial-gradient(1px 1px at 78% 12%,var(--star) 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 35% 62%,var(--star) 50%,transparent 51%),radial-gradient(1px 1px at 90% 70%,var(--star) 50%,transparent 51%),
  radial-gradient(1px 1px at 58% 35%,var(--star) 50%,transparent 51%),radial-gradient(1.5px 1.5px at 6% 85%,var(--star) 50%,transparent 51%),
  radial-gradient(ellipse at 50% -8%,var(--g1) 0,transparent 45%),radial-gradient(ellipse at 0% 60%,var(--g2) 0,transparent 40%),
  radial-gradient(ellipse at 100% 85%,var(--g3) 0,transparent 42%),linear-gradient(170deg,var(--bga),var(--bgb) 55%,var(--bgc));
 background-attachment:fixed}
body:before{content:var(--dtop);position:fixed;top:8px;left:0;right:0;text-align:center;pointer-events:none;opacity:.35;color:var(--accent);font-size:1rem;letter-spacing:.5em;z-index:0}
body:after{content:var(--dbot);position:fixed;bottom:8px;left:0;right:0;text-align:center;pointer-events:none;opacity:.3;color:var(--accent2);font-size:1rem;letter-spacing:.4em;z-index:0;animation:drift 20s ease-in-out infinite}
main{position:relative;z-index:1;max-width:850px;margin:auto}
header{position:relative;text-align:center;padding:14px 0 14px}
header:before,header:after{content:"✧";position:absolute;color:var(--gold);font-size:1.4rem;animation:floaty 3.8s ease-in-out infinite;opacity:.8}
header:before{left:7%;top:28%}header:after{right:7%;top:38%;animation-delay:1.3s}
header .emoji{font-size:2.1rem;filter:drop-shadow(0 0 12px var(--accent));animation:floaty 4.5s ease-in-out infinite}
.eyebrow{font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-top:6px;text-shadow:0 0 12px #e8c98744}
h1{margin:4px 0 6px;font-size:clamp(2rem,7vw,3.2rem);font-style:italic;font-weight:700;letter-spacing:.02em;color:var(--title);
 text-shadow:0 0 10px var(--tg1),0 0 32px var(--tg2),0 3px #07050c}
h2{font-style:italic;color:var(--h2);letter-spacing:.04em}
p,.muted{color:var(--muted)}
header p{max-width:30em;margin:6px auto 0;line-height:1.5}
.ornaments{display:flex;justify-content:center;gap:15px;margin-top:10px;font-size:1.05rem;color:var(--accent)}
.ornaments span:nth-child(2n){color:var(--accent2)}.ornaments span:nth-child(3n){color:var(--big)}
.card{position:relative;overflow:hidden;margin:16px 0;padding:20px 18px;border-radius:26px 26px 26px 26px / 22px 30px 22px 30px;
 border:1px solid var(--line);
 background:radial-gradient(circle at 100% 0,var(--cg1),transparent 45%),radial-gradient(circle at 0 100%,var(--cg2),transparent 45%),linear-gradient(150deg,var(--c1),var(--c2) 60%,var(--c3));
 box-shadow:0 18px 44px #000a,inset 0 1px #ffffff12,inset 0 0 0 4px var(--bga),inset 0 0 0 5px var(--frame),0 0 28px var(--frame);backdrop-filter:blur(8px)}
.card:before{content:"✧ · 🍃 · ✧";position:absolute;right:16px;top:9px;font-size:.75rem;letter-spacing:.16em;color:var(--gold);opacity:.6;pointer-events:none}
.card:after{content:"✦";position:absolute;left:16px;bottom:9px;color:var(--accent);opacity:.5;pointer-events:none}
.big{font-size:clamp(3.6rem,17vw,6.4rem);font-weight:800;font-style:italic;line-height:1.05;text-align:center;padding:14px 0;color:var(--big);
 text-shadow:0 0 14px var(--bigglow),0 0 40px var(--bigglow),0 0 70px var(--frame)}
.prank{text-align:center;font-size:1.15rem;line-height:1.6;white-space:pre-wrap;color:var(--text);padding:0 4px}
.stats{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.9rem;margin:14px 0;font-style:italic}
.btns{display:flex;gap:9px;flex-wrap:wrap}.btns button{flex:1}
button{border:0;border-radius:16px;padding:12px 15px;font:inherit;font-weight:700;cursor:pointer;transition:transform .18s,filter .18s,box-shadow .18s}
button:hover{filter:brightness(1.15) saturate(1.1);transform:translateY(-2px)}button:active{transform:translateY(1px) scale(.985)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.primary{position:relative;overflow:hidden;width:100%;font-size:1.15rem;letter-spacing:.04em;color:var(--pt);border:1px solid var(--pb);
 background:linear-gradient(115deg,var(--p1),var(--p2) 45%,var(--p3) 75%,var(--p4));background-size:240% 240%;animation:glowshift 9s ease infinite;
 box-shadow:0 4px 0 var(--pshadow),0 8px 28px var(--pglow),inset 0 1px #fff3;text-shadow:0 1px 5px #0006}
.primary:after{content:"✧ ✦ ✧";position:absolute;right:12px;top:50%;transform:translateY(-50%);opacity:.8;font-size:.8rem;pointer-events:none;color:var(--pt)}
.secondary{color:var(--sc);border:1px solid var(--sb);background:linear-gradient(135deg,var(--s1),var(--s2) 78%,var(--s3));box-shadow:0 3px 0 var(--sshadow)}
.error{color:var(--red);min-height:1.3em;font-size:.9rem}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tools input[type=search]{flex:1;min-width:160px}
input[type=search]{width:100%;padding:11px 13px;font:inherit;color:var(--text);background:var(--inbg);border:1px solid var(--inb);border-radius:14px;box-shadow:inset 0 2px 7px #0007}
input::placeholder{color:var(--muted);opacity:.7}
input[type=checkbox]{accent-color:var(--accent)}
.list{display:grid;gap:9px;margin-top:14px}
.entry{position:relative;display:grid;grid-template-columns:44px 1fr;gap:11px;align-items:start;padding:12px;border-radius:16px;color:var(--text);
 background:linear-gradient(120deg,var(--e1),var(--e2) 68%,var(--e3));border:1px solid var(--eb);box-shadow:0 4px 14px #0004;transition:transform .18s,border-color .18s,box-shadow .18s}
.entry:after{content:"✧";position:absolute;right:9px;top:6px;color:var(--accent2);opacity:.4;pointer-events:none}
.entry:hover{transform:translateY(-2px);border-color:var(--ehover);box-shadow:0 7px 22px var(--frame)}
.num{font-weight:800;font-style:italic;text-align:center;padding:8px 2px;border-radius:12px;color:var(--nt);border:1px solid var(--nb);
 background:linear-gradient(145deg,var(--n1),var(--n2));box-shadow:inset 0 0 14px var(--frame)}
.desc{white-space:pre-wrap;line-height:1.5}
.tag{font-size:.75rem;color:var(--gold);margin-top:4px;letter-spacing:.08em}
.entry.picked{opacity:.55;background:linear-gradient(120deg,var(--pick1),var(--pick2));border-color:var(--pickb)}
.entry.picked .desc{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.entry.picked .num{text-decoration:line-through;color:var(--red)}
.empty{text-align:center;padding:18px;color:var(--muted);font-style:italic}
button.fey-tap{animation:witchyPulse .6s ease-out}
@keyframes witchyPulse{0%{box-shadow:0 0 0 0 var(--frame),0 0 0 0 var(--frame)}45%{box-shadow:0 0 0 8px var(--frame),0 0 22px var(--pglow)}100%{box-shadow:0 0 0 16px transparent,0 0 0 transparent}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(10deg)}}
@keyframes glowshift{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes drift{0%,100%{transform:translateX(-2%)}50%{transform:translateX(2%)}}
@media(min-width:620px){.list{grid-template-columns:1fr 1fr}.entry{min-height:80px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* hero avatar + theme picker */
.avatar{display:block;width:92px;height:92px;margin:0 auto 6px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);box-shadow:0 0 0 4px var(--bga),0 0 22px var(--pglow),0 0 40px var(--frame);animation:floaty 5s ease-in-out infinite}
.themes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 0}
.themes button{padding:7px 12px;font-size:.82rem;border-radius:999px;color:var(--sc);border:1px solid var(--sb);background:linear-gradient(135deg,var(--s1),var(--s3));box-shadow:none}
.themes button[aria-pressed="true"]{border-color:var(--accent);color:var(--title);box-shadow:0 0 14px var(--pglow),inset 0 0 0 1px var(--accent)}
.themes .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.install{display:none;margin:10px auto 0;padding:8px 14px;font-size:.85rem}

<script>
const ITEMS=[{"n": 1, "text": "The player’s helmet smells heavily of cheese for the rest of the day."}, {"n": 2, "text": "Put a fake spider/insect/monster in their sleeping bag. Or real ones."}, {"n": 3, "text": "You are cursed with mildly aggravating misfortune. Once per day out\nof combat, at random, you make a skill check with disadvantage."}, {"n": 4, "text": "Your hair is a kleptomaniac."}, {"n": 5, "text": "You can no longer distinguish left and right."}, {"n": 6, "text": "The sound of a bell turned your known languages into horse neighs."}, {"n": 7, "text": "Enchanting the victim to spew a swarm of angry bees from their mouth every time they open it. The bees immediately attack nearby creatures, the victim included. The enchantment ends as soon as the victim comes into contact with honey or at the next blue moon, whichever occurs sooner."}, {"n": 8, "text": "Your breathing is always loud and obnoxious."}, {"n": 9, "text": "Goblins now look like beautiful women."}, {"n": 10, "text": "They made you pee yourself while you were asleep."}, {"n": 11, "text": "Describe or name a specific type of beast. All creatures of this kind\nare now enamored with you, however you are now slightly allergic to them."}, {"n": 12, "text": "The character no longer has a shadow"}, {"n": 13, "text": "You lose your most treasured memory."}, {"n": 14, "text": "The afflicted player REALLY needs to sneeze, but can’t."}, {"n": 15, "text": "The players find targeted insults written in leaves around their campsite."}, {"n": 16, "text": "You are gifted a pouch of fairy dust that is actually just itching or sneezing powder."}, {"n": 17, "text": "The Fey creature makes the players switch bodies for 1d4 hours."}, {"n": 18, "text": "Everything you eat tastes like chicken."}, {"n": 19, "text": "Your reflection sticks its tongue out at you."}, {"n": 20, "text": "The pranker hosts a game show where the PCs are the players, and not getting your hands transformed into tree branches for 7 days is the main prize."}, {"n": 21, "text": "They cast Silence on you while you slept, so you wake up with a really sore throat."}, {"n": 22, "text": "The Fey creature freezes an important item in a block of ice."}, {"n": 23, "text": "Anytime you touch something that is the color (d6) it automatically\nturns (d6). (d6:) 1. Red; 2. Orange; 3. Yellow; 4. Green; 5. Blue; 6.\nPurple"}, {"n": 24, "text": "An angry family of bees suddenly appear in a random player's armor."}, {"n": 25, "text": "You shall spread wealth wherever you go but never hold this wealth\nyourself."}, {"n": 26, "text": "Dump water all over the sleeping party."}, {"n": 27, "text": "All coins look like gold to you."}, {"n": 28, "text": "The Fey creature replaces any wands the players have with a wand that shoots confetti back at them."}, {"n": 29, "text": "Every day, your eyes, change their color."}, {"n": 30, "text": "The Fey creature covers random equipment in grease, making it difficult to hold on to."}, {"n": 31, "text": "A random player gets polymorphed into a chipmunk."}, {"n": 32, "text": "You can no longer form new bird-related memories."}, {"n": 33, "text": "Bright lights appear as soon as someone says the word Stealth and won’t disappear until someone not in the party sees you."}, {"n": 34, "text": "The character eats and drinks messily and noisily, no matter how hard\nthe player tries to prevent this."}, {"n": 35, "text": "A Satyr follows a person playing theme music."}, {"n": 36, "text": "The Fey creature, from a tree branch above the players, plays loud music on a lute when they are trying to sleep."}, {"n": 37, "text": "The PCs’ clothes turn into very expensive and beautiful outfits. The PCs also can only use very formal words in a conversation."}, {"n": 38, "text": "Poke holes in the bottom of their waterskin."}, {"n": 39, "text": "Adds a few rocks to a characters backpack every now and then so it gradually gets heavier and heavier."}, {"n": 40, "text": "The Fey creature glues two player's hands together for 1d4 days."}, {"n": 41, "text": "The entire party gets the hiccups."}, {"n": 42, "text": "From now on, every pet you see, you see it as an evil monster."}, {"n": 43, "text": "Once every year on the night of the summer solstice you are magically\nsummoned to a place far beyond your recognition. There you will be given\none task that you would give your life to complete."}, {"n": 44, "text": "A random female PC gets an unremovable flower crown, but every flower in that crown is 3 times bigger than that PC’s head."}, {"n": 45, "text": "Players with moustaches lose them, players without moustaches wake up with one."}, {"n": 46, "text": "The Fey creature replaces the party's healing potions with red wine."}, {"n": 47, "text": "The Fey creature braids all the party's hair together as they sleep."}, {"n": 48, "text": "The Fey creature drops an egg on the head of a random part member."}, {"n": 49, "text": "The Fey creature makes it so all of the players must rhyme with each other, or take damage for 1d4 days."}, {"n": 50, "text": "The party awakes to find their voices are all one octave higher."}, {"n": 51, "text": "Your blood is now alabaster white."}, {"n": 52, "text": "You can no longer conceive of \"eleven.\""}, {"n": 53, "text": "The Fey creature dyes any animals the party has to look like easter eggs."}, {"n": 54, "text": "Your equipment is coated in oil, making it nearly impossible to hold onto."}, {"n": 55, "text": "You can't use your eyes and ears at the same time anymore. One must\nbe covered in order to use the other. Trying to use both eyes and ears\nwill result in audio or visual hallucinations."}, {"n": 56, "text": "Lose all memories of a loved one. This loved one may be from the\ncharacter's past, or a future loved one. Tough to recognize, unless this\ncharacter disagrees with the number of people in a group."}, {"n": 57, "text": "A tune which you can’t quite place plays faintly in the distance. No one else can hear it."}, {"n": 58, "text": "Woopie cushion under the horses saddle."}, {"n": 59, "text": "Every time the character swears their servitude at the end of their\nlives extends by 1 year."}, {"n": 60, "text": "You will become aware of the exact time of your death."}, {"n": 61, "text": "They create the illusion of a dragon/tarrasque/purple wurm about to swallow you whole. Just before it reaches you, it disappears into mist."}, {"n": 62, "text": "The entire camp is now covered in faerie dragons who won’t leave the players alone. They make random comments all the time and are generally unhelpful and irritating. They go away after a few hours."}, {"n": 63, "text": "Your childhood pet always appears to you to be in the room, but no\none else can see it."}, {"n": 64, "text": "Make everything taste like raisins. Except raisins…"}, {"n": 65, "text": "Every time a bag is opened it makes a fart sound."}, {"n": 66, "text": "The Fey creature casts invisibility on a random party member."}, {"n": 67, "text": "The Fey creature leaves raw meat around the player's campsite to attract wild animals."}, {"n": 68, "text": "The character now unwillingly slips Sylvan words into their everyday\nspeech and cannot be brought aware of it."}, {"n": 69, "text": "The afflicted player feels uncomfortably warm, no matter the environment."}, {"n": 70, "text": "A rhinoceros is stampeding down the thin path. It’s a pretty obvious illusion without a shadow or footprints that passes through anyone harmlessly if they don’t move. Anyone that the illusion passes through now smells like a sweaty stinky rhinoceros."}, {"n": 71, "text": "Looking at a corpse that is more than 1 year old causes you to\ninstantly vomit."}, {"n": 72, "text": "From now on when you sleep, you will not wake without someone\nperforming the same ceremony. While sleeping you do not age, require\nsustenance, or suffer non-lethal damage."}, {"n": 73, "text": "You are unable to fall asleep anywhere except outside, at night, in a\nplace where the stars are visible."}, {"n": 74, "text": "The concept of death is unbearably sad, so that you burst into tears\nwhenever it comes up."}, {"n": 75, "text": "Whenever you speak, you bawk like a chicken. You cannot hear it as bawking. Anyone trying to explain to you that you’re bawking will register upon you as saying they can’t hear you and you need to talk louder."}, {"n": 76, "text": "They painted your face to look like a cartoony animal."}, {"n": 77, "text": "The skin and hair of the PCs now have unusual and bright coloring."}, {"n": 78, "text": "Switch every party members feet, giving them all a penalty to move speed and a saving throw against tripping."}, {"n": 79, "text": "Your eyes look like the eyes of the person you talk to."}, {"n": 80, "text": "A PC suddenly has a trail of small saplings following him where that PC goes."}, {"n": 81, "text": "Lure an alligator into one of their tents."}, {"n": 82, "text": "At midnight you recite strange lines from musicals you have never heard."}, {"n": 83, "text": "The would become cold, ever so cold. Warmth becomes something\nimpossible for you to feel."}, {"n": 84, "text": "Filling a canteen with mud"}, {"n": 85, "text": "Subtly change a character’s voice inflection so every comment sounds like innuendo."}, {"n": 86, "text": "The character can no longer go to sleep without making a stone circle\naround themselves."}, {"n": 87, "text": "You age backwards (but this will not prolong your life)."}, {"n": 88, "text": "Even the smallest explosion looks like a nuclear detonation to you."}, {"n": 89, "text": "The Fey creature summons a swarm of small Fey dragons that will not leave the party alone."}, {"n": 90, "text": "Cats meows now sound like orc battle cries to you."}, {"n": 91, "text": "A player wakes up with a bloody, severed head in his sleeping bag. Once held it screams and bursts into a bunch of moths."}, {"n": 92, "text": "Reversing the victims facial expressions, causing their face to express the opposite of whatever emotion they try show. Trying to frown results in a smile, an attempt at sneering ends up as a look of admiration, etc."}, {"n": 93, "text": "One of your friends was never born, although you retain memories of\nthem."}, {"n": 95, "text": "Steal one of the party members’ voices."}, {"n": 96, "text": "Water always feels very cold to you."}, {"n": 97, "text": "The player sees the world in black and white for the rest of the day."}, {"n": 98, "text": "The afflicted player has an itch in an unreachable part of their back. Whoever itches it is afflicted next."}, {"n": 99, "text": "Pixies cast a glamour spell on the ugliest person in the party. Suddenly that PC is a gorgeous female elf."}, {"n": 100, "text": "Your most used magic item that requires a verbal component is\nreplaced by an embarrassing nickname."}, {"n": 101, "text": "Your blood is perceived as (d6) by everyone except you. (d6:) 1. Red;\n2. Orange; 3. Yellow; 4. Green; 5. Blue; 6. Purple"}, {"n": 102, "text": "The Fey creature makes every member of the party speak a random new language for 1d4 hours."}, {"n": 103, "text": "The Fey creature will begin using telekinesis on the party's campfire to make it float away."}, {"n": 104, "text": "You can no longer perceive the color (d6:) 1. Red; 2. Orange; 3.\nYellow; 4. Green; 5. Blue; 6. Purple"}, {"n": 105, "text": "The PCs are still completely aware, but their bodies are controlled by the pranker. She makes them do sinchronised dancing for 1 hour."}, {"n": 106, "text": "The character's eyes are inversed in color; the irises are now white\nand the whites are the color of the irises.\n"}, {"n": 107, "text": "One of the party (any gender) starts to feel increasingly bloated and nauseous over the course of three days. They are far more hungry and crave odd combinations of food. They wake up on the fourth day to find a large egg in bed with them as though they have laid it. The egg eventually hatches into a really ridiculous and ugly leggy bird that runs off laughing (or another creature of the GM’s discretion.)"}, {"n": 108, "text": "The next time a weapon is drawn, POOF, it’s now a rubber chicken and pixie dust is everywhere. Squeezing it makes a dumb noise. It turns back after a few rounds."}, {"n": 109, "text": "The Fey creature puts an angry badger into a random player's backpack."}, {"n": 110, "text": "Leaves notes with target insults where the party will find them."}, {"n": 111, "text": "The character is convinced they can talk to plants, despite having no\nability to do so."}, {"n": 112, "text": "One of the party finds themselves uncomfortable and unable to sleep thus losing the benefits of a long rest and instead becoming exhausted. A single pea placed under their bedroll is the cause. If planted, the pea will sprout into a magical beanstalk."}, {"n": 113, "text": "The entire party grows deer antlers."}, {"n": 114, "text": "Hide a cricket in their gear somewhere, remind the players constantly of the chirrping."}, {"n": 115, "text": "You cannot use any word beginning with the letter ___"}, {"n": 116, "text": "A talking flea now lives in your nose."}, {"n": 117, "text": "Cover bed rolls with honey."}, {"n": 118, "text": "While walking through the wilderness, the party comes across footprints they recognize as their own tracks. The party isn’t wandering in circles, though; the prankster has simply copied or transplanted some footprints from earlier in their journey."}, {"n": 119, "text": "You can hear with supernatural precision, but to do so you have to\nwear the most ridiculous hat anyone has ever seen. In fact, the hat\ninduces immediate laughter to any who see it being worn."}, {"n": 120, "text": "The Fey creature swaps two random party members' voices."}, {"n": 121, "text": "You owe a pound of flesh - you can choose which pound if you remove\nit yourself."}, {"n": 122, "text": "Your self-image will always be of whatever you are currently wearing\n- no matter what you wear you will always see yourself wearing the same\nclothes."}, {"n": 123, "text": "Leaves an obviously magical stone in the middle of your camp. What it does is hidden from you. Any attempts to discover the magic make absolutely no sense. But it is definitely doing something. (Something like attracting snails to a place one mile away from it, something no reasonable player would ever have reason to figure out.) "}, {"n": 124, "text": "Steal the last day of their memory."}, {"n": 125, "text": "The Fey creature drips animal attracting liquid on the players as they sleep."}, {"n": 126, "text": "The Fey creature creates an illusion of a powerful dragon flying overhead. Just when it is about to reach the party, it ex-\nplodes into glitter"}, {"n": 127, "text": "You hear booming thunder in the middle of the night, waking you up. Surprise surprise, it’s not actually storming."}, {"n": 128, "text": "Wanted posters up everywhere with their faces on it. Bonus points if crime is something embarrassing."}, {"n": 129, "text": "The taste of citrus now tastes like blood."}, {"n": 130, "text": "Random flowers begin growing out of any books the players own."}, {"n": 131, "text": "Hide something like fish guts somewhere in they won’t easily find and let it slowly rot and stink up everything."}, {"n": 132, "text": "They all wake up with the same face for one hour."}, {"n": 133, "text": "Touching gloves makes your hands feel like they are getting stung by\nbees."}, {"n": 134, "text": "A random party member cannot use vowels for one hour."}, {"n": 135, "text": "A songbird starts to follow a party member around. The next time they roll a 1 on an attack or ability check, it flies overhead and poops on them."}, {"n": 136, "text": "The next time you see a frog, it will loudly proclaim that if you\nkiss it it will become a prince. Whether or not it really does is\ndecided by the DM."}, {"n": 137, "text": "Your sneezes produce sparkling dust."}, {"n": 138, "text": "Every time you see a bear, you perceive it as a 60 year old human\nwearing a bear costume."}, {"n": 139, "text": "Fingernails tell short stories about what you have done clipping/\nbiting them causes you to forget what happened but eating the nail\nreturns the memory."}, {"n": 140, "text": "The Fey creature leads the party into a hedge maze."}, {"n": 141, "text": "creepy-crawlies in your shoes."}, {"n": 142, "text": "The Fey creature sprinkles hot peppers into whatever the party is eating."}, {"n": 143, "text": "The Fey creature showers the players with a sack of glitter."}, {"n": 144, "text": "The Fey creature takes away the party's reflections for 1d4 days."}, {"n": 145, "text": "Your team is followed around by a troop of squirrels. Whenever you say a certain, fairly common word, they bombard you with walnuts."}, {"n": 146, "text": "Every time you sleep, you only dream of yourself lying awake and wake\nup less rested than before."}, {"n": 147, "text": "Swap two party members’ voices."}, {"n": 148, "text": "You must give yourself a pep talk every morning."}, {"n": 149, "text": "You are polymorphed into a chipmunk. It can only be broken by you receiving damage."}, {"n": 150, "text": "The Fey creature randomly casts Silence on a party member when they are trying to talk."}, {"n": 151, "text": "Your skin becomes hot pink direct sun light."}, {"n": 152, "text": "Both of the character's eyes are now the entirely the color of what\ntheir irises used to be."}, {"n": 153, "text": "The Fey creature creates an illusionary sack of gold over a pile of bear droppings."}, {"n": 154, "text": "A random PC starts to grow long, soft, brightly colored fur out of their neck and wrists."}, {"n": 155, "text": "Suddenly, only trolls find you to be attractive. When seen by a\ntroll, you will be aggressively sought after for a long term relationship."}, {"n": 156, "text": "You shall lead a great Kingdom for 10 years but it will then fall\ninto ruin due to your efforts."}, {"n": 157, "text": "The PCs and all their equipment appear black and white to everyone, including themselves."}, {"n": 158, "text": "You are gifted a fire breathing chicken that lays spicy eggs."}, {"n": 159, "text": "The character emits a melodious ringing noise every time they yawn,\nsneeze or burp."}, {"n": 160, "text": "You lose d6 inches of height."}, {"n": 161, "text": "You are physically incapable of looking anyone directly in the eyes."}, {"n": 162, "text": "The party notices that their shadows are making rude gestures at them."}, {"n": 163, "text": "Everyone in the party look like the same person. (it’s who the pixies think is ugliest)"}, {"n": 164, "text": "Many small fairies are helping a gigantic elderly snail slowly cross the road. It will take an hour for it to cross. The fairies warn you not to leave the path in the mean time. Will-o’-wisps lurk on the borders as a warning. Anyone who does leave the path hoping to simply walk around the snail finds themselves instantly transported into a confusing and thorny hedge-maze that takes more than an hour to escape from."}, {"n": 165, "text": "The Fey creature transforms all of the party members into dishes that are needed for it's tea party. They can still see and\nhear, but must endure 1d4 hours of the Fey creature drinking tea from them"}, {"n": 166, "text": "You shall conceive a full family but lose one of them on their 11th\nbirthday to the fey."}, {"n": 167, "text": "Sitting causes you physical pain - you can only stand up or lay down."}, {"n": 168, "text": "You happen across a traveling merchant offering excellent deals. All his goods and even his change are fake. (transformed sticks, leaves, dirt, old boots, etc.)"}, {"n": 169, "text": "The Fey creature casts Haste on any pack animal in the party."}, {"n": 170, "text": "A dryad wishes someone to stay and talk with them. She casts a root spell, if the PC stops for more than a min the PC feet start to root in place."}, {"n": 171, "text": "They REALLY messed up your hair."}, {"n": 173, "text": "Charcoal doodles on your face."}, {"n": 174, "text": "The Fey creature places a stinking fish in a random player's backpack."}, {"n": 175, "text": "A secret will be revealed that will make you hate someone you loved."}, {"n": 176, "text": "The character has forgotten their own name. No one will remember them,\neven close friends and family."}, {"n": 177, "text": "The Fey creature places the party's most favored magic item in a bird nest high above them."}, {"n": 178, "text": "Confetti everywhere! Or glitter. Or Faerie fire. Just something brightly coloured and with a tendency to get everywhere."}, {"n": 180, "text": "The Fey creature gives magic mushrooms to all the player's horses."}, {"n": 181, "text": "Reposition all trees in the area the party slept in into a weird pattern."}, {"n": 182, "text": "Your coins have been enchanted with magic mouths to tell bad puns. They insult your poverty, your social status, merchants, and any goods you are trying to buy."}, {"n": 183, "text": "Replace all of your arrow heads with red berries. (If first pulled out in battle the PC might not notice before firing one or two.)"}, {"n": 184, "text": "Shave half a beard or mustache."}, {"n": 185, "text": "The player sees the world in inverted colour for the rest of the day."}, {"n": 186, "text": "Someone cast Enlarge/Reduce on the player’s clothing. Needless to say, it no longer fits."}, {"n": 187, "text": "A large group of saplings begin following the players, mimicking everything they're doing."}, {"n": 188, "text": "The Fey creature leaves a pile of gold in the middle of the party's campsite, that will turn into leaves in 1d4 hours."}, {"n": 189, "text": "All elves look the same to you."}, {"n": 190, "text": "Stuff moss into the toes of their boots so they think their shoes shrunk."}, {"n": 191, "text": "The party finds a fruit tree growing a variety of fruits and vegetables, even kinds that don’t grow on trees. They are perfectly fine to eat, but none of them taste how they look. (The banana tastes like potato, the broccoli tastes like orange, etc. )"}, {"n": 192, "text": "When it rains, you perceive every droplet as a human face."}, {"n": 193, "text": "You think you are the worlds greatest bard."}, {"n": 194, "text": "The Fey creature will cast Grease on the ground in front of the players."}, {"n": 195, "text": "You wake up on another continent."}, {"n": 196, "text": "Vines and leaves will now be sparingly intermingled with the\ncharacter's hair and body hair."}, {"n": 197, "text": "The voice of the last person you killed tells you things about their\nlife no one wants to know."}, {"n": 198, "text": "All stealth gear (lockpicks, hidden daggers, etc) glows in the dark."}, {"n": 199, "text": "You can only read the written word backwards - usually from right to\nleft."}, {"n": 200, "text": "One tenth of all gold you earn disappears as a tribute to the Fae."}, {"n": 201, "text": "A random player wakes up with an extra limb that will disappear in 1d4 hours."}, {"n": 202, "text": "You become obsessed by kittens."}, {"n": 203, "text": "You can no longer go outside unless it's pouring rain."}, {"n": 204, "text": "Sand in pants and pebbles in shoes."}, {"n": 205, "text": "You always smell strongly of flowers - it's a little overwhelming."}, {"n": 206, "text": "The Fey creature turns the player's armor invisible."}, {"n": 207, "text": "The Fey creature casts Shrink on a random player's clothing."}, {"n": 208, "text": "All water tastes oily."}, {"n": 209, "text": "Everyone’s boots and shoes are now only left-footed. This fixes after 24 hours."}, {"n": 210, "text": "Draws moustaches on a random party member while they sleep. "}, {"n": 211, "text": "The classic ‘kick me’ sign on their back."}, {"n": 212, "text": "Freeze an item inside a block of ice."}, {"n": 213, "text": "Anytime you see holy water, you get a great urge to down the whole\nbottle."}, {"n": 214, "text": "Wrap all their gear in thick vines."}, {"n": 215, "text": "Your knees become fused. You loose the ability to run."}, {"n": 216, "text": "The PCs are transformed into furniture and dishes needed for a tea party. They can still see and hear, but can’t willingly interact with the world in any way. The pranker and her friends appear out of nowhere to sit down, drink a cup of tea and gossip."}, {"n": 217, "text": "You now have the ability to fly short distances, but only if your\neyes are closed."}, {"n": 218, "text": "Character is unable to see the color blue or green as it blends\nperfectly into the background."}, {"n": 219, "text": "The Fey creature polymorphs a random player into a donkey."}, {"n": 220, "text": "In the middle of the night, the party’s campfire throws off colorful sparks for 1d4 minutes."}, {"n": 221, "text": "Make them think their sword or pet or hat can talk to them."}, {"n": 222, "text": "The entire camp is found floating 10 feet in the air. Even the campfire. Getting down is difficult."}, {"n": 223, "text": "Ogres look incredibly beautiful to you and nymphs seem hideous."}, {"n": 224, "text": "The Fey creature steals a random player's voice for the evening."}, {"n": 225, "text": "The Fey creature steals the party's memories from the last 24 hours."}, {"n": 226, "text": "You don’t believe in having a small fire anymore."}, {"n": 227, "text": "The Fey creature makes crowns made out of poison ivy and sets them on the player's heads as they sleep."}, {"n": 228, "text": "Someone turned all our armor bright pink!"}, {"n": 229, "text": "A random PC’s hair becomes 10 times longer than before and stops being affected by gravity."}, {"n": 230, "text": "The Fey creature makes a random player's waterskin make a screaming noise when they drink from it."}, {"n": 231, "text": "The Fey creature casts Invisibility on a bag of crickets and lets them loose in the party's gear."}, {"n": 232, "text": "Touching rope whatsoever gives you rope burn instantly."}, {"n": 233, "text": "You gain extreme sensitivity to moonlight."}, {"n": 234, "text": "The PCs gain traits of various forest animals (deer antlers, squirrel tail, etc.)"}, {"n": 235, "text": "Each player wakes up with an extra limb or without one."}, {"n": 236, "text": "The Fey creature makes the party's campfire illusionary, so it won't cook anything or provide heat until the party notices."}, {"n": 237, "text": "The Fey creature will create a swamp illusion over a normal section of road."}, {"n": 238, "text": "The character glows in artificial light."}, {"n": 239, "text": "The PCs’ clothes become bound to their bodies and turn into dancing outfits. The PCs also lose the ability to speak and always dance when trying to move, battle or interact with something. Lasts one day."}, {"n": 240, "text": "You can speak to the trees. They only talk about boring topics such\nas politics and the weather, but will not listen to anything you have to\nsay."}, {"n": 241, "text": "There will be a surprise when they get home. What they find will\nbelong to the fey in 5 years time."}, {"n": 242, "text": "Turn your hat into a frog."}, {"n": 243, "text": "Leaving an enchanted pile of gold out in the grass, with every coin permanently transforms into a marigold the next time it is exposed to sunlight after being stored away."}, {"n": 244, "text": "A random PC’s hands turn into bushes. Strange berries that grow on these bushes also apply that same effect when consumed."}, {"n": 245, "text": "A random party member's skin turns blue for a few hours."}, {"n": 246, "text": "The PCs are transformed into tiny pink dragons with glitter breath. The effect lasts for 2d4 hours."}, {"n": 247, "text": "Switch some of their coins for the chocolate covered variety."}, {"n": 248, "text": "The Fey creature makes a hallucinating mushroom look like a delicious apple."}, {"n": 249, "text": "You must marry the Fae you are bargaining with."}, {"n": 250, "text": "The Fey creature enchants the party's clothing to make them colder and colder."}, {"n": 251, "text": "The character's ears enlarge when they are caught lying. The\ncharacter's ears shrink when they tell the truth and are not believed."}, {"n": 252, "text": "The Fey creature covers the party's map with blueberry mush."}, {"n": 253, "text": "The player wakes up on top of a tree, along with all their heavy gear, backpacks, knapsacks, and even sleeping bags and tent, if they have those. if they slept in a cart or something, that gets taken up too. Naturally, they’ll all fall out of the tree immediately."}, {"n": 254, "text": "You lose d4 letters of your name."}, {"n": 255, "text": "The Fey creature casts dancing lights to follow the players through the forest."}, {"n": 256, "text": "The Fey creature casts Enlarge on a random player's clothing."}, {"n": 257, "text": "The Fey creature begins mimicking the sound of a hill giant in the forest near the players."}, {"n": 258, "text": "The Fey creature steals an object from one player and puts it in the backpack of another player."}, {"n": 259, "text": "Cast prestidigitation to make a black cloud float over someone’s head wherever they go. Including indoors."}, {"n": 260, "text": "The party is dumped into a hedge maze that cheats by re-arranging itself."}, {"n": 261, "text": "One language you know is replaced with screaming but you think it’s\nnormal."}, {"n": 262, "text": "Your firstborn shall carve out a great destiny but will be taken from\nyou at the moment of its birth, either through the fey arriving and\ntaking it or its mortal body arriving as a still birth and it's soul\nbeing born into the fey wild"}, {"n": 263, "text": "A random party member begins growing hair all over their body."}, {"n": 264, "text": "A piece of parchment was glued to your back, just out of reach. It says something incredibly unflattering."}, {"n": 265, "text": "Everyone’s ears have been changed into donkey ears."}];
const STORE='fey-prank-picked-v1';
let picked=[];try{picked=JSON.parse(localStorage.getItem(STORE)||'[]').filter(n=>ITEMS.some(x=>x.n===n))}catch{}
let last=null;
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(STORE,JSON.stringify(picked))}catch{}}
function render(){
 const set=new Set(picked);$('pickedCount').textContent=`${picked.length} / ${ITEMS.length} picked`;$('leftCount').textContent=`${ITEMS.length-picked.length} remaining`;
 const query=$('search').value.trim().toLowerCase(),remaining=$('showRemaining').checked;
 const visible=ITEMS.filter(x=>(!remaining||!set.has(x.n))&&(!query||String(x.n).includes(query)||x.text.toLowerCase().includes(query)));
 const root=$('entries');root.replaceChildren();
 if(!visible.length){root.innerHTML='<div class="empty">No matching entries.</div>';return}
 for(const x of visible){const el=document.createElement('div');el.className='entry'+(set.has(x.n)?' picked':'');const num=document.createElement('div');num.className='num';num.textContent=x.n;const content=document.createElement('div');const desc=document.createElement('div');desc.className='desc';desc.textContent=x.text;content.appendChild(desc);if(set.has(x.n)){const tag=document.createElement('div');tag.className='tag';tag.textContent='✓ PICKED';content.appendChild(tag)}el.append(num,content);root.appendChild(el)}

// ---- Fey sound: a long enchanted chime run + several random laughs sliced from the embedded laugh.
// Segments (seconds) of the 9s laugh recording that contain individual giggles.
const LAUGH_SLICES=[[0,2.3],[2.47,4.48],[4.8,5.18],[5.86,7.1]];
let feyLastSlice=-1,feyLaughStop=null,feyAudioContext=null,feyLaughBuffer=null,feyLaughLoading=false,feyLaughAudio=null;
// Pick a random giggle, never the same one twice in a row.
function pickLaughSlice(){let i;do{i=Math.floor(Math.random()*LAUGH_SLICES.length)}while(i===feyLastSlice&&LAUGH_SLICES.length>1);feyLastSlice=i;return LAUGH_SLICES[i]}
function loadFeyLaugh(ctx){
 if(feyLaughBuffer||feyLaughLoading)return;feyLaughLoading=true;
 if(!ctx){const O=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!O){feyLaughLoading=false;return}try{ctx=new O(1,1,44100)}catch(e){feyLaughLoading=false;return}}
 try{
  const b64=FEY_LAUGH_DATA.split(',')[1],bin=atob(b64),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const p=ctx.decodeAudioData(bytes.buffer,buf=>{feyLaughBuffer=buf},()=>{feyLaughLoading=false});
  if(p&&p.catch)p.catch(()=>{feyLaughLoading=false});
 }catch(e){feyLaughLoading=false}
}
function fallbackLaugh(){
 try{
  if(!feyLaughAudio){feyLaughAudio=new Audio(FEY_LAUGH_DATA);feyLaughAudio.preload='auto'}
  const sl=pickLaughSlice();
  feyLaughAudio.pause();feyLaughAudio.currentTime=sl[0];
  feyLaughAudio.playbackRate=.85+Math.random()*.3;feyLaughAudio.volume=.85;
  const p=feyLaughAudio.play();if(p&&p.catch)p.catch(()=>{});
  clearTimeout(feyLaughStop);feyLaughStop=setTimeout(()=>{try{feyLaughAudio.pause()}catch(e){}},(sl[1]-sl[0])/feyLaughAudio.playbackRate*1000);
 }catch(e){}
}
function playFeySound(){
 const Ctx=window.AudioContext||window.webkitAudioContext;
 if(!Ctx){fallbackLaugh();return}
 try{
  if(!feyAudioContext)feyAudioContext=new Ctx();
  const ctx=feyAudioContext;
  if(ctx.state==='suspended')ctx.resume();
  loadFeyLaugh(ctx);
  const now=ctx.currentTime+.02;
  // Master bus with a soft echo so everything sounds like it's drifting through a cavern of mushrooms.
  const master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);
  const echo=ctx.createDelay(1);echo.delayTime.value=.23;
  const fb=ctx.createGain();fb.gain.value=.36;const wet=ctx.createGain();wet.gain.value=.38;
  master.connect(echo);echo.connect(fb);fb.connect(echo);echo.connect(wet);wet.connect(ctx.destination);
  const palettes=[
   {notes:[784,1046.5,1318.5,1568,2093,1760,2349.3,1568,1318.5,1046.5],wave:'sine',gap:.2},
   {notes:[659.3,987.8,1318.5,1760,1975.5,1568,1318.5,987.8,880,659.3],wave:'triangle',gap:.22},
   {notes:[1568,1318.5,1046.5,784,1046.5,1568,2093,2637,2093,1568],wave:'sine',gap:.18},
   {notes:[523.3,622.3,784,932.3,1174.7,1568,1864.7,1568,1174.7,784],wave:'triangle',gap:.2},
   {notes:[2093,1760,2637,2349.3,3136,2637,2093,1568,1760,1318.5],wave:'sine',gap:.17},
   {notes:[587.3,880,1174.7,1480,1760,2217.5,1760,1480,1174.7,880],wave:'triangle',gap:.21}
  ];
  const pal=palettes[Math.floor(Math.random()*palettes.length)];
  pal.notes.forEach((f,i)=>{
   const o=ctx.createOscillator(),g=ctx.createGain(),at=now+i*pal.gap;
   o.type=pal.wave;o.frequency.setValueAtTime(f*(.97+Math.random()*.06),at);
   g.gain.setValueAtTime(.0001,at);
   g.gain.exponentialRampToValueAtTime(.03+Math.random()*.02,at+.03);
   g.gain.exponentialRampToValueAtTime(.0001,at+.5+Math.random()*.3);
   o.connect(g);g.connect(master);o.start(at);o.stop(at+.85);
  });
  // Long shimmering undertone (about 3.5s).
  const sh=ctx.createOscillator(),sg=ctx.createGain();
  sh.type='sine';sh.frequency.setValueAtTime(180+Math.random()*200,now);
  sh.frequency.exponentialRampToValueAtTime(600+Math.random()*500,now+2.6);
  sg.gain.setValueAtTime(.0001,now);sg.gain.exponentialRampToValueAtTime(.014,now+.4);sg.gain.exponentialRampToValueAtTime(.0001,now+3.4);
  sh.connect(sg);sg.connect(master);sh.start(now);sh.stop(now+3.5);
  // Random laughs: 2-4 randomly chosen giggles, each at its own pitch, volume and stereo position.
  if(!feyLaughBuffer){fallbackLaugh();return}
  const count=2+Math.floor(Math.random()*3);let t=now+.15+Math.random()*.3;
  for(let k=0;k<count;k++){
   const [s0,s1]=pickLaughSlice();
   const rate=.82+Math.random()*.5,dur=(s1-s0)/rate;
   const src=ctx.createBufferSource();src.buffer=feyLaughBuffer;src.playbackRate.value=rate;
   const g=ctx.createGain(),vol=.55+Math.random()*.4;
   g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.04);
   g.gain.setValueAtTime(vol,t+Math.max(.05,dur-.12));g.gain.linearRampToValueAtTime(.0001,t+dur);
   let out=g;
   if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=Math.random()*1.4-.7;g.connect(p);out=p}
   src.connect(g);out.connect(master);src.start(t,s0,s1-s0);
   t+=dur*(.55+Math.random()*.35);
  }
 }catch(e){fallbackLaugh()}
}

// Decode the laugh as soon as the page opens so even the very first press is random.
loadFeyLaugh(null);

// A small visual twinkle accompanies every button press, not only drawing a prank.
document.addEventListener('click',e=>{
 const btn=e.target.closest('button');
 if(!btn) return;
 playFeySound();
 btn.classList.remove('fey-tap');
 void btn.offsetWidth;
 btn.classList.add('fey-tap');
 setTimeout(()=>btn.classList.remove('fey-tap'),380);
},true);
function draw(){ $('error').textContent='';const available=ITEMS.filter(x=>!picked.includes(x.n));if(!available.length){$('error').textContent=`All ${ITEMS.length} pranks have been drawn. Reset all to start a new round.`;return}const x=available[Math.floor(Math.random()*available.length)];last=x.n;picked.push(x.n);$('number').textContent=x.n;$('prank').textContent=x.text;save();render();window.scrollTo({top:0,behavior:'smooth'});}
$('draw').addEventListener('click',draw);
$('undo').addEventListener('click',()=>{if(last===null){$('error').textContent='There is no latest draw to undo.';return}picked=picked.filter(n=>n!==last);$('number').textContent='?';$('prank').textContent='Draw undone. Ready for another?';last=null;$('error').textContent='';save();render()});
$('reset').addEventListener('click',()=>{if(!confirm(`Reset all ${ITEMS.length} pranks and clear the draw history?`))return;picked=[];last=null;$('number').textContent='?';$('prank').textContent='Your fey fate awaits…';$('error').textContent='';save();render()});
$('search').addEventListener('input',render);$('showRemaining').addEventListener('change',render);
$('export').addEventListener('click',()=>{const lines=ITEMS.map(x=>`${picked.includes(x.n)?'[X]':'[ ]'} ${x.n}. ${x.text}`);if(window.AndroidBridge){AndroidBridge.shareText(lines.join('\n\n'));return}const blob=new Blob([lines.join('\n\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='fey-pranks-crossed-off.txt';a.click();URL.revokeObjectURL(url)});
render();

// ---- Themes (remembered on this device)
const THEMES=[['midnight','🌙 Midnight Grimoire','#b890f0','#0d0a16'],['pixie','💀 Pixie Grin','#ff6fb5','#07120d'],['bone','🦴 Skull & Moss','#c9da6c','#0c0d08'],['toadstool','🍄 Toadstool Grove','#e08bf0','#12081a'],['wings','🦋 Dragonfly Wings','#8ff0e2','#071318']];
function applyTheme(id,persist){
 if(!THEMES.some(t=>t[0]===id))id='midnight';
 if(id==='midnight')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',id);
 const t=THEMES.find(t=>t[0]===id);let m=document.querySelector('meta[name=theme-color]');if(m)m.content=t[3];
 document.querySelectorAll('#themes button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===id)));
 if(persist){try{localStorage.setItem('fey-theme',id)}catch{}}
}
(function(){const box=document.getElementById('themes');
 for(const [id,label,sw] of THEMES){const b=document.createElement('button');b.dataset.theme=id;b.type='button';b.innerHTML='<span class="sw" style="background:'+sw+'"></span>'+label;b.addEventListener('click',()=>applyTheme(id,true));box.appendChild(b)}
 let cur='midnight';try{cur=localStorage.getItem('fey-theme')||'midnight'}catch{}applyTheme(cur,false)})();
// ---- Install as an app (PWA)
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('install').style.display='inline-block'});
$('install').addEventListener('click',async()=>{if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch{}deferredInstall=null;$('install').style.display='none'});
window.addEventListener('appinstalled',()=>{$('install').style.display='none'});
if('serviceWorker' in navigator&&false){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
